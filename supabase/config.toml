# Supabase Configuration
# Reference: https://supabase.com/docs/guides/local-development

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 5432
major_version = 17

[db.seed]
sql_paths = ["./seed.sql"]

[studio]
port = 54323
enabled = true

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = 52428800

[auth]
enable_signup = true
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
